<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Typecase</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="dist/app.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ti-grok" viewBox="0 0 16 16"><path d="M3 13 13 3M9.5 3H13v3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ti-cursor" viewBox="0 0 16 16"><path d="M4 2.5 12.5 8 8.3 9.1 6.4 13.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
      <symbol id="ti-claude" viewBox="0 0 16 16"><path d="M8 2v12M3 5l10 6M13 5 3 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="ti-codex" viewBox="0 0 16 16"><path d="m3 4.5 4 3.5-4 3.5M8.5 12H13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ti-shared" viewBox="0 0 16 16"><circle cx="5.5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10.5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    </defs>
  </svg>
  <div class="app-drag"></div>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-drag"></div>
      <nav id="sidenav" class="sidenav"></nav>
    </aside>

    <main id="main" class="main">
      <div id="main-drag" class="main-drag"></div>
      <div class="toolbar" id="toolbar">
        <button class="tb-btn" id="toggle-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor"/></svg>
        </button>
        <div class="tb-sep"></div>
        <div class="tb-group back-group" id="back-group" data-detail-only hidden>
          <button class="tb-btn back-btn" id="back-btn" title="Back to skills (Esc)" aria-label="Back to skills">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="tb-sep"></div>
        </div>
        <button class="tb-btn" id="density-btn" title="Row density">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor"/></svg>
        </button>
        <div class="tb-tabs" id="segmented" role="tablist" aria-label="View" data-detail-only hidden>
          <button data-tab="rendered" role="tab">Rendered</button>
          <button data-tab="source" role="tab">Source</button>
          <button data-tab="history" role="tab">History</button>
        </div>
        <div class="tb-spacer"></div>
        <button class="tb-btn" id="theme-btn" title="Theme: system"></button>
        <button class="search-pill" id="search-pill">
          <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Search</span><kbd>⌘K</kbd>
        </button>
      </div>

      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-label="Search skills">
      <input id="palette-input" type="text" placeholder="Search skills, triggers, descriptions…" autocomplete="off" spellcheck="false" />
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>

  <script src="dist/app.js"></script>
</body>
</html>
